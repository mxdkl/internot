# --- society (the monotone world, internot_society::mono) --------------------
# The `us` pack at its own scale (about 14M born by 2023); memory and lookups
# don't grow with scale (measured to 14 trillion, AGENTS.md). Inputs are
# uniform over everyone born by 2023, timed one call per sample. Provisional
# budgets (2026-10-03): about 2-3x the p99 measured by mono_report.
[budget."society/birth"]
mode = "warm"
p99_ns = 1000

[budget."society/death"]
mode = "warm"
p99_ns = 1500
max_allocs = 0

[budget."society/mother"]
mode = "warm"
p99_ns = 1000
max_allocs = 0

[budget."society/father"]
mode = "warm"
p99_ns = 4000
max_allocs = 0

[budget."society/spouse"]
mode = "warm"
p99_ns = 2000
max_allocs = 0

[budget."society/children"]
mode = "warm"
p99_ns = 8000

[budget."society/siblings"]
mode = "warm"
p99_ns = 10000

# A full name at 2023 (first, middle, surname: the surname walks the father's
# line to a founder). Warm: every input's year tables built first.
[budget."society/full_name"]
mode = "warm"
p99_ns = 100_000

# Work (2026-10-04): a whole career; the spell in force at a date (the
# career walk, then a search); a job's employer with its name and place
# (one home lookup at the job's start, memoized per unit).
[budget."society/career"]
mode = "warm"
p99_ns = 150_000

[budget."society/work_at"]
mode = "warm"
p99_ns = 150_000

[budget."society/employer"]
mode = "warm"
p99_ns = 1_500_000

# Everyone alive at a date, exact (16 threads): closed form plus the
# infant band checked one by one; and the instant bounds.
[budget."society/count_alive"]
mode = "warm"
p99_ns = 5_000_000

[budget."society/alive_bounds"]
mode = "warm"
p99_ns = 5_000_000

[budget."society/world_build"]
mode = "warm"
p99_ns = 500_000_000
