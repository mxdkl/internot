# Performance budgets: every benchmark perf-gate measures must have one.
# Spec: docs/superpowers/specs/2026-09-29-society-as-a-function.md §16.2.
#
# A budget is never raised silently: raising one needs a design change or an
# exception the founder explicitly approved, noted in a comment next to it.
#
# [budget."<suite>/<bench>"]
# mode = "warm" | "cold"   required; must match how the benchmark runs
# p99_ns = <number>        required; maximum p99 latency per call
# p50_ns = <number>        optional; maximum median
# max_allocs = <integer>   optional; maximum heap allocations in any one call

[gate]
# Fail when p99 exceeds the committed baseline's p99 by more than this fraction.
max_regression = 0.10

# --- core_hash -------------------------------------------------------------
# PLACEHOLDERS. This example suite proves the plumbing; these primitives have
# no §16.2 budget yet. Set at ~4x the p99 measured on the reference machine
# (Ryzen 9 5900HX, powersave governor, 2026-09-29): hash_int 23-25 ns,
# hash_float 25-27 ns, lognormal 88-97 ns. Zero allocations measured.

[budget."core_hash/hash_int"]
mode = "warm"
p99_ns = 100
max_allocs = 0

[budget."core_hash/hash_float"]
mode = "warm"
p99_ns = 100
max_allocs = 0

[budget."core_hash/lognormal"]
mode = "warm"
p99_ns = 400
max_allocs = 0

